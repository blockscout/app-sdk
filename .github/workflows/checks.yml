name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code_quality:
    runs-on: ubuntu-latest
    name: Code quality

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The complexity gate diffs the pull request against origin/main
          fetch-depth: 0

      # The pnpm version comes from the packageManager field in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check spelling
        run: pnpm lint:cspell --no-progress

      - name: Compile TypeScript
        run: pnpm typecheck

      # Only the functions the pull request changes are gated
      - name: Cognitive complexity gate
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm test:code-complexity --changed=origin/main

      - name: Build the package
        run: pnpm build
