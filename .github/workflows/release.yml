name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        type: string
        required: true
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish package to NPM registry
    permissions:
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The pnpm version comes from the packageManager field in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Also it will setup .npmrc file to publish to npm
      # No dependency cache here: the publish job does not restore a cache other runs wrote
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Update package version
        run: |
          npm version ${{ inputs.version || github.ref_name }} --no-git-tag-version

      - name: Build the package
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish to NPM registry
        run: |
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
